[pytest]
# ★ 2026-10-08：本仓库原先**没有** pytest 配置 ⇒ 裸跑 `pytest` 会递归收集
#   `data/trash/`（项目回收站）里的历史 `*_test.py`，触发
#   `import file mismatch` 收集期报错（实测 5 errors，直接中断整轮回归）。
#   显式声明测试根与递归排除，使 `pytest` 与项目标准命令 `pytest tests/` 等价
#   （标准基线：1542 passed / 4 skipped / 166 subtests）。
testpaths = tests
# 覆盖 pytest 默认值，故需把默认项一并列出（`.*` 亦为默认，勿删）
norecursedirs = .* _darcs build CVS dist node_modules venv .venv data baseline scripts docs artifacts
