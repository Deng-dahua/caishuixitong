<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>报告生成与导出 - 财税风险防控系统</title>
  <link rel="stylesheet" href="/static/css/app.css?v=9d7d76fc75">
  <style>
    * { box-sizing: border-box; }
    body { margin:0; font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
           background:#f5f7fa; color:#1e293b; font-size:14px; }
    .topbar { display:flex; align-items:center; gap:12px; padding:12px 20px; background:#1e293b; color:#fff; }
    .topbar h1 { font-size:16px; margin:0; font-weight:700; }
    .topbar .spacer { flex:1; }
    .topbar a, .topbar button, .topbar select { color:#cbd5e1; background:none;
              border:1px solid rgba(255,255,255,.25); border-radius:5px; padding:5px 12px;
              font-size:12px; cursor:pointer; text-decoration:none; }
    .topbar select { color:#e2e8f0; background:#1e293b; max-width:280px; }
    .topbar a:hover, .topbar button:hover { background:rgba(255,255,255,.12); color:#fff; }
    .wrap { padding:16px 20px; max-width:1600px; margin:0 auto; }
    .tabs { display:flex; gap:4px; margin-bottom:12px; }
    .tab { padding:8px 16px; background:#fff; border:1px solid #e2e8f0; border-radius:6px;
           cursor:pointer; font-size:13px; color:#475569; }
    .tab.active { background:#3b82f6; border-color:#3b82f6; color:#fff; font-weight:600; }
    .card { background:#fff; border:1px solid #e2e8f0; border-radius:8px; padding:12px 14px; margin-bottom:12px; }
    .card h3 { margin:0 0 10px; font-size:14px; color:#0f172a; display:flex; align-items:center; gap:8px; }
    .card h3 .hint { font-weight:400; font-size:12px; color:#64748b; }
    .toolbar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
    .toolbar input, .toolbar select { padding:6px 10px; border:1px solid #cbd5e1; border-radius:5px;
              font-size:13px; background:#fff; }
    .toolbar input[type=text] { width:190px; }
    .toolbar label { font-size:12px; color:#64748b; }
    .btn { padding:6px 14px; border:1px solid #3b82f6; background:#3b82f6; color:#fff;
           border-radius:5px; font-size:13px; cursor:pointer; }
    .btn:hover { background:#2563eb; }
    .btn.ghost { background:#fff; color:#334155; border-color:#cbd5e1; }
    .btn.ghost:hover { background:#f1f5f9; }
    .btn.sm { padding:3px 9px; font-size:12px; }
    .btn:disabled { opacity:.5; cursor:not-allowed; }
    table.grid { width:100%; border-collapse:collapse; }
    table.grid th, table.grid td { padding:8px 10px; text-align:left;
            border-bottom:1px solid #f1f5f9; font-size:13px; vertical-align:top; }
    table.grid th { background:#f8fafc; color:#64748b; font-weight:600; font-size:12px; white-space:nowrap; }
    table.grid tr:hover td { background:#f8fafc; }
    td.wrap { white-space:normal; max-width:420px; }
    .tag { display:inline-block; padding:2px 9px; border-radius:10px; font-size:12px; }
    .t-ok{background:#dcfce7;color:#15803d} .t-warn{background:#fef3c7;color:#b45309}
    .t-info{background:#e0e7ff;color:#4338ca} .t-mute{background:#f1f5f9;color:#475569}
    .msg { padding:8px 12px; border-radius:6px; font-size:13px; margin-bottom:10px; }
    .msg.ok{background:#dcfce7;color:#15803d;border:1px solid #bbf7d0}
    .msg.err{background:#fee2e2;color:#991b1b;border:1px solid #fecaca}
    .msg.warn{background:#fef3c7;color:#b45309;border:1px solid #fde68a}
    .views { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:10px; }
    .vcard { border:1px solid #e2e8f0; border-radius:8px; padding:10px 12px; cursor:pointer;
             background:#fff; transition:.15s; }
    .vcard:hover { border-color:#93c5fd; box-shadow:0 2px 8px rgba(59,130,246,.12); }
    .vcard.on { border-color:#3b82f6; background:#eff6ff; }
    .vcard .vt { font-weight:700; font-size:13.5px; }
    .vcard .vn { font-size:11.5px; color:#64748b; margin-top:2px; word-break:break-all; }
    .vcard .vd { font-size:12px; color:#475569; margin-top:6px; line-height:1.6; }
    .vcard .vc { font-size:11px; color:#94a3b8; margin-top:6px; }
    .chk { display:inline-flex; align-items:center; gap:5px; font-size:13px; margin-right:14px; }
    .muted { color:#64748b; font-size:12px; }
    .kv { display:grid; grid-template-columns:140px 1fr; gap:5px 10px; font-size:13px; }
    .kv .k { color:#64748b; }
    .drawer { position:fixed; top:0; right:0; width:min(1080px,95vw); height:100vh; background:#f8fafc;
              box-shadow:-8px 0 24px rgba(15,23,42,.18); overflow:auto; z-index:50;
              transform:translateX(102%); transition:transform .22s; }
    .drawer.open { transform:none; }
    .drawer .dh { position:sticky; top:0; background:#1e293b; color:#fff; padding:12px 16px;
                  display:flex; align-items:center; gap:10px; z-index:2; }
    .drawer .dh h2 { font-size:15px; margin:0; }
    .drawer .db { padding:14px 16px 40px; }
    .mask { position:fixed; inset:0; background:rgba(15,23,42,.35); z-index:49; display:none; }
    .mask.open { display:block; }
    .preview { border:1px solid #e2e8f0; border-radius:6px; height:min(74vh,780px); width:100%; background:#fff; }
    .bar-track { background:#e2e8f0; border-radius:6px; height:8px; overflow:hidden; margin-top:6px; }
    .bar-fill { height:100%; background:#3b82f6; width:0; transition:width .3s; }
    code { background:#f1f5f9; padding:1px 4px; border-radius:3px; font-size:12px; }
  </style>
</head>
<body>
  <div class="topbar">
    <h1>📄 报告生成与导出</h1>
    <span class="muted" style="color:#94a3b8" id="who"></span>
    <div class="spacer"></div>
    <select id="project" title="选择稽查项目（决定对哪个账套出报告）"></select>
    <button id="btn-refresh">刷新</button>
    <a href="/">返回主界面</a>
  </div>

  <div class="wrap">
    <div id="alert"></div>

    <div class="tabs">
      <div class="tab active" data-tab="gen" id="tab-gen">生成报告</div>
      <div class="tab" data-tab="history" id="tab-history">报告列表 / 历史版本</div>
      <div class="tab" data-tab="versions" id="tab-versions">版本台账</div>
    </div>

    <!-- ═══════════ 生成 ═══════════ -->
    <div id="pane-gen">
      <div class="card">
        <h3>1. 选择报告视图 <span class="hint">视图 = 同一份底稿的**范围/粒度**，不是四份不同名称的报告</span></h3>
        <div class="views" id="view-cards"></div>
        <div class="muted" id="view-note" style="margin-top:8px"></div>
      </div>

      <div class="card">
        <h3>2. 导出格式与复核标识</h3>
        <div class="toolbar" id="fmt-box"></div>
        <div class="toolbar" style="margin-top:10px">
          <label>人工复核标识</label>
          <select id="f-reviewed">
            <option value="">按实际处置记录推断</option>
            <option value="1">标记为「已复核」</option>
            <option value="0">标记为「未经人工复核」</option>
          </select>
          <label>复核人</label>
          <input type="text" id="f-reviewer" placeholder="复核人姓名">
          <label>本次生成说明</label>
          <input type="text" id="f-note" placeholder="change_note（选填）">
        </div>
        <div class="muted" style="margin-top:8px">
          免责声明与人工复核标识由**渲染层强制**：缺失时报告**不予产出**（直接报错，不静默）。
        </div>
        <div class="toolbar" style="margin-top:10px">
          <button class="btn" id="btn-generate">▶ 生成报告</button>
          <span class="muted" id="gen-status"></span>
        </div>
        <div class="bar-track"><div class="bar-fill" id="gen-bar"></div></div>
      </div>

      <div class="card" id="result-card" style="display:none">
        <h3>3. 生成结果</h3>
        <div id="result-body"></div>
      </div>
    </div>

    <!-- ═══════════ 报告列表 ═══════════ -->
    <div id="pane-history" style="display:none">
      <div class="card">
        <h3>报告列表 <span class="hint" id="list-hint"></span></h3>
        <div class="toolbar">
          <label>视图</label>
          <select id="f-listview"><option value="">全部</option></select>
          <button class="btn ghost" id="btn-list-refresh">刷新</button>
        </div>
        <table class="grid" style="margin-top:10px">
          <thead><tr>
            <th>文书编号</th><th>版本</th><th>报告名称</th><th>视图</th>
            <th>格式</th><th>复核</th><th>风险项</th><th>生成时间</th><th>生成人</th><th>操作</th>
          </tr></thead>
          <tbody id="tb-reports"><tr><td colspan="10" class="muted">加载中…</td></tr></tbody>
        </table>
      </div>
    </div>

    <!-- ═══════════ 版本台账 ═══════════ -->
    <div id="pane-versions" style="display:none">
      <div class="card">
        <h3>版本台账 <span class="hint">唯一权威 <code>data/report_versions.jsonl</code>（append-only）</span></h3>
        <table class="grid">
          <thead><tr><th>文书编号</th><th>版本</th><th>报告名称</th><th>文稿类型</th>
            <th>复核</th><th>生成时间</th><th>分析作业</th><th>说明</th></tr></thead>
          <tbody id="tb-versions"><tr><td colspan="8" class="muted">加载中…</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- ═══════════ 详情 / 预览抽屉 ═══════════ -->
  <div class="mask" id="mask"></div>
  <div class="drawer" id="drawer">
    <div class="dh">
      <h2 id="d-title">报告详情</h2>
      <div class="spacer" style="flex:1"></div>
      <button class="btn ghost sm" id="d-close">关闭</button>
    </div>
    <div class="db" id="d-body"></div>
  </div>

  <script src="/static/js/security.js"></script>
  <script src="/static/js/reports.js"></script>
</body>
</html>
