<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>法规库 - 财税风险防控系统</title>
  <link rel="stylesheet" href="/static/css/app.css?v=9d7d76fc75">
  <style>
    * { box-sizing: border-box; }
    body { margin:0; font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
           background:#f5f7fa; color:#1e293b; font-size:14px; }
    .topbar { display:flex; align-items:center; gap:12px; padding:12px 20px; background:#1e293b; color:#fff; }
    .topbar h1 { font-size:16px; margin:0; font-weight:700; }
    .topbar .spacer { flex:1; }
    .topbar a { color:#cbd5e1; border:1px solid rgba(255,255,255,.25); border-radius:5px;
                padding:5px 12px; font-size:12px; text-decoration:none; }
    .topbar a:hover { background:rgba(255,255,255,.12); color:#fff; }
    .wrap { padding:16px 20px; max-width:1400px; margin:0 auto; }
    .card { background:#fff; border:1px solid #e2e8f0; border-radius:8px; margin-bottom:14px; }
    .card > h3 { margin:0; padding:12px 16px; font-size:14px; border-bottom:1px solid #f1f5f9; }
    .card > .body { padding:14px 16px; }
    .kpis { display:flex; flex-wrap:wrap; gap:10px; }
    .kpi { flex:1 1 132px; background:#f8fafc; border:1px solid #e2e8f0; border-radius:7px; padding:10px 12px; }
    .kpi .n { font-size:20px; font-weight:700; color:#0f172a; }
    .kpi .t { font-size:12px; color:#64748b; margin-top:3px; }
    .toolbar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:10px; }
    .toolbar input, .toolbar select { padding:6px 10px; border:1px solid #cbd5e1; border-radius:5px; font-size:13px; }
    .toolbar input[type=text] { min-width:260px; }
    .btn { padding:6px 14px; border:1px solid #3b82f6; background:#3b82f6; color:#fff;
           border-radius:5px; font-size:13px; cursor:pointer; }
    .btn:hover { background:#2563eb; }
    .btn.ghost { background:#fff; color:#334155; border-color:#cbd5e1; }
    .btn.ghost:hover { background:#f1f5f9; }
    table.grid { width:100%; border-collapse:collapse; }
    table.grid th, table.grid td { padding:8px 11px; text-align:left; border-bottom:1px solid #f1f5f9;
                                   font-size:13px; vertical-align:top; }
    table.grid th { background:#f8fafc; color:#64748b; font-weight:600; font-size:12px; }
    table.grid tr:hover td { background:#f8fafc; }
    .muted { color:#94a3b8; }
    .msg { padding:8px 12px; border-radius:5px; font-size:13px; margin-bottom:10px; }
    .msg.err { background:#fef2f2; color:#b91c1c; border:1px solid #fecaca; }
    .msg.warn { background:#fffbeb; color:#b45309; border:1px solid #fde68a; }
    .tag { display:inline-block; padding:2px 8px; border-radius:10px; font-size:12px; background:#f1f5f9; color:#475569; }
    .tag.current { background:#dcfce7; color:#15803d; }
    .tag.amended { background:#e0e7ff; color:#3730a3; }
    .tag.unknown { background:#fef3c7; color:#b45309; }
    .tag.superseded, .tag.expired { background:#fee2e2; color:#b91c1c; }
    .law-link { color:#2563eb; cursor:pointer; text-decoration:none; }
    .law-link:hover { text-decoration:underline; }
    .art { font-family:"Consolas","Courier New",monospace; color:#475569; white-space:nowrap; }
    .content { line-height:1.62; }
    pre.plain { margin:0; white-space:pre-wrap; word-break:break-word; font-family:inherit; line-height:1.62; }
    dialog { border:1px solid #cbd5e1; border-radius:8px; max-width:820px; width:92%; padding:0; }
    dialog::backdrop { background:rgba(15,23,42,.45); }
    .dhead { padding:12px 16px; border-bottom:1px solid #f1f5f9; display:flex; align-items:center; gap:8px; }
    .dhead h4 { margin:0; font-size:14px; flex:1; }
    .dbody { padding:14px 16px; max-height:66vh; overflow:auto; }
  </style>
  <script src="/static/js/security.js?v=96a020abfa"></script>
</head>
<body>
  <div class="topbar">
    <h1>📖 法规库</h1>
    <span class="spacer"></span>
    <span class="muted" id="who" style="color:#94a3b8"></span>
    <a href="/rules">规则库</a>
    <a href="/?page=home">返回主界面</a>
  </div>
  <div class="wrap">
    <div id="alert"></div>

    <div class="card">
      <h3>法规库概览 <span class="muted" id="src-note"></span></h3>
      <div class="body">
        <div class="kpis" id="kpis"></div>
        <div class="muted" id="coverage-note" style="margin-top:10px;line-height:1.7"></div>
      </div>
    </div>

    <div class="card">
      <h3>正文检索 <span class="muted">（条文一律来自数据文件；未收录的不得编造）</span></h3>
      <div class="body">
        <div class="toolbar">
          <input type="text" id="q" placeholder="关键词（法名 / 条款号 / 正文，如「红字发票」）">
          <select id="law-sel"><option value="">全部法名</option></select>
          <label class="muted"><input type="checkbox" id="only-current"> 仅现行有效</label>
          <button class="btn" id="btn-search">检索</button>
          <button class="btn ghost" id="btn-reset">重置</button>
          <span class="muted" id="ent-hint"></span>
        </div>
        <table class="grid">
          <thead><tr><th style="width:210px">法名</th><th style="width:110px">条款</th>
            <th>条文内容</th><th style="width:150px">版本状态</th><th style="width:120px">来源</th></tr></thead>
          <tbody id="tb-entries"><tr><td colspan="5" class="muted">加载中…</td></tr></tbody>
        </table>
        <div class="toolbar" style="margin-top:10px">
          <button class="btn ghost" id="pg-prev">上一页</button>
          <span class="muted" id="pg-info"></span>
          <button class="btn ghost" id="pg-next">下一页</button>
        </div>
      </div>
    </div>

    <div class="card">
      <h3>法清单 <span class="muted" id="law-hint"></span></h3>
      <div class="body">
        <table class="grid">
          <thead><tr><th style="width:280px">法名</th><th style="width:80px">已收录条数</th>
            <th style="width:150px">版本状态</th><th>现行版本 / 出处</th></tr></thead>
          <tbody id="tb-laws"><tr><td colspan="4" class="muted">加载中…</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>

  <dialog id="dlg">
    <div class="dhead"><h4 id="dlg-title"></h4><button class="btn ghost" id="dlg-close">关闭</button></div>
    <div class="dbody" id="dlg-body"></div>
  </dialog>

  <script src="/static/js/legal_library.js?v=d839d10b03"></script>
  <script src="/static/js/page-memory.js?v=8c10b70862" defer></script>
</body>
</html>
