<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>修改密码 · 财税风险防控系统</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh; margin: 0; display: grid; place-items: center;
      font-family: "Microsoft YaHei", system-ui, sans-serif;
      color: #1f2937; background: linear-gradient(145deg, #081226, #17325e);
    }
    main {
      width: min(440px, calc(100% - 32px)); padding: 40px;
      background: #fff; border-radius: 16px; box-shadow: 0 24px 70px #0006;
    }
    h1 { margin: 0 0 8px; font-size: 22px; text-align: center; }
    .subtitle { margin: 0 0 24px; color: #667085; text-align: center; font-size: 14px; }
    label { display: block; margin: 14px 0 7px; font-size: 14px; font-weight: 650; }
    input {
      width: 100%; padding: 12px 14px; border: 1px solid #cbd5e1;
      border-radius: 9px; font-size: 16px; outline: none;
    }
    input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px #2563eb22; }
    button {
      width: 100%; margin-top: 22px; padding: 12px; border: 0; border-radius: 9px;
      color: #fff; background: #1d4ed8; font-size: 16px; font-weight: 700; cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    #msg {
      display: none; margin-top: 16px; padding: 10px 12px; border-radius: 8px;
      font-size: 14px; line-height: 1.7;
    }
    .err { border: 1px solid #fecaca; color: #991b1b; background: #fef2f2; }
    .okm { border: 1px solid #bbf7d0; color: #15803d; background: #f0fdf4; }
    .hint { margin: 18px 0 0; color: #667085; font-size: 12px; line-height: 1.7; }
  </style>
</head>
<body>
  <main>
    <h1>修改密码</h1>
    <p class="subtitle">验证原密码后设置新密码 · 修改成功需重新登录</p>
    <form id="pw-form">
      <label for="old_password">原密码</label>
      <input id="old_password" type="password" autocomplete="current-password" required autofocus>
      <label for="new_password">新密码（至少 12 位，含大小写字母/数字/符号中至少三类）</label>
      <input id="new_password" type="password" autocomplete="new-password" required>
      <label for="confirm_password">确认新密码</label>
      <input id="confirm_password" type="password" autocomplete="new-password" required>
      <button id="submit" type="submit">确认修改</button>
      <div id="msg" class="err" role="alert" style="display:none"></div>
    </form>
    <div id="done" style="display:none">
      <div id="msg-ok" class="okm" style="display:block">密码已修改，正在跳转到登录页…</div>
    </div>
    <p class="hint">提示：以手机号创建的账号，原密码即手机号；修改后请牢记新密码。</p>
  </main>
  <script>
    function getCsrfToken() {
      const cookie = document.cookie.split('; ').find(c => c.startsWith('csrf_token='));
      return cookie ? decodeURIComponent(cookie.split('=').slice(1).join('=')) : '';
    }
    const form = document.getElementById("pw-form");
    const submit = document.getElementById("submit");
    const msg = document.getElementById("msg");
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      msg.style.display = "none";
      const newPw = document.getElementById("new_password").value;
      if (newPw !== document.getElementById("confirm_password").value) {
        msg.textContent = "两次输入的新密码不一致";
        msg.style.display = "block";
        return;
      }
      submit.disabled = true;
      submit.textContent = "提交中…";
      try {
        const response = await fetch("/api/auth/change-password", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-CSRF-Token": getCsrfToken()
          },
          body: JSON.stringify({
            old_password: document.getElementById("old_password").value,
            new_password: newPw
          })
        });
        const data = await response.json();
        if (response.status === 401) { location.href = "/login"; return; }
        if (!response.ok || !data.ok) throw new Error(data.message || "修改失败");
        // 成功：展示结果并跳回登录页
        form.style.display = "none";
        document.getElementById("done").style.display = "block";
        setTimeout(() => { location.href = "/login"; }, 1500);
      } catch (error) {
        msg.textContent = error.message || "网络异常，请稍后重试";
        msg.style.display = "block";
        submit.disabled = false;
        submit.textContent = "确认修改";
      }
    });
  </script>
  <script src="/static/js/page-memory.js?v=7ad84b2737" defer></script>
</body>
</html>
