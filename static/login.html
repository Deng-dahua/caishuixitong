<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>财税风险防控系统 · 安全登录</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh; margin: 0; display: grid; place-items: center;
      font-family: "Microsoft YaHei", system-ui, sans-serif;
      color: #172033; background: linear-gradient(145deg, #081226, #17325e);
    }
    main {
      width: min(420px, calc(100% - 32px)); padding: 40px;
      background: #fff; border-radius: 16px; box-shadow: 0 24px 70px #0006;
    }
    h1 { margin: 0 0 8px; font-size: 23px; text-align: center; }
    .subtitle { margin: 0 0 28px; color: #667085; text-align: center; font-size: 14px; }
    label { display: block; margin: 16px 0 7px; font-size: 14px; font-weight: 650; }
    input {
      width: 100%; padding: 12px 14px; border: 1px solid #cbd5e1;
      border-radius: 9px; font-size: 16px; outline: none;
    }
    input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px #2563eb22; }
    button {
      width: 100%; margin-top: 24px; padding: 12px; border: 0; border-radius: 9px;
      color: #fff; background: #1d4ed8; font-size: 16px; font-weight: 700; cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    #error {
      display: none; margin-top: 16px; padding: 10px 12px; border: 1px solid #fecaca;
      border-radius: 8px; color: #991b1b; background: #fef2f2; font-size: 14px;
    }
    .notice { margin: 20px 0 0; color: #667085; font-size: 12px; line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <h1>财税风险防控系统</h1>
    <p class="subtitle">使用管理员分配的账号登录</p>
    <form id="login-form">
      <label for="username">用户名</label>
      <input id="username" name="username" autocomplete="username" maxlength="64" required autofocus>
      <label for="password">密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button id="submit" type="submit">登录</button>
      <div id="error" role="alert"></div>
    </form>
    <p class="notice">登录失败会触发渐进式锁定。请勿共享账号或在公共设备保存密码。</p>
  </main>
  <script>
    const form = document.getElementById("login-form");
    const submit = document.getElementById("submit");
    const errorBox = document.getElementById("error");
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      errorBox.style.display = "none";
      submit.disabled = true;
      submit.textContent = "正在验证…";
      try {
        const response = await fetch("/api/auth/login", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({
            username: document.getElementById("username").value.trim(),
            password: document.getElementById("password").value
          })
        });
        const data = await response.json();
        if (!response.ok || !data.ok) throw new Error(data.message || "登录失败");
        location.assign("/select-company");
      } catch (error) {
        errorBox.textContent = error.message || "网络异常，请稍后重试";
        errorBox.style.display = "block";
        submit.disabled = false;
        submit.textContent = "登录";
      }
    });
  </script>
</body>
</html>
