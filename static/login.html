<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>财税风险防控系统 · 安全登录</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh; margin: 0; display: grid; place-items: center;
      font-family: "Microsoft YaHei", system-ui, sans-serif;
      color: #172033; background: linear-gradient(145deg, #081226, #17325e);
    }
    main {
      width: min(420px, calc(100% - 32px)); padding: 40px;
      background: #fff; border-radius: 16px; box-shadow: 0 24px 70px #0006;
    }
    h1 { margin: 0 0 8px; font-size: 23px; text-align: center; }
    .subtitle { margin: 0 0 28px; color: #667085; text-align: center; font-size: 14px; }
    label { display: block; margin: 16px 0 7px; font-size: 14px; font-weight: 650; }
    input {
      width: 100%; padding: 12px 14px; border: 1px solid #cbd5e1;
      border-radius: 9px; font-size: 16px; outline: none;
    }
    input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px #2563eb22; }
    button {
      width: 100%; margin-top: 24px; padding: 12px; border: 0; border-radius: 9px;
      color: #fff; background: #1d4ed8; font-size: 16px; font-weight: 700; cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    #error {
      display: none; margin-top: 16px; padding: 10px 12px; border: 1px solid #fecaca;
      border-radius: 8px; color: #991b1b; background: #fef2f2; font-size: 14px;
    }
    /* ★ 2026-10-19：登录页内的「修改密码」表单（同一套视觉，不引入新样式体系） */
    #pw-msg {
      display: none; margin-top: 16px; padding: 10px 12px; border-radius: 8px;
      font-size: 14px; line-height: 1.7;
    }
    #pw-msg.err { border: 1px solid #fecaca; color: #991b1b; background: #fef2f2; }
    #pw-msg.okm { border: 1px solid #bbf7d0; color: #15803d; background: #f0fdf4; }
    #pw-form { border-top: 1px dashed #e2e8f0; margin-top: 18px; padding-top: 6px; }
    #pw-form button { background: #0f766e; }
    #pw-form button:hover { background: #115e59; }
    .notice { margin: 20px 0 0; color: #667085; font-size: 12px; line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <h1>财税风险防控系统</h1>
    <p class="subtitle">使用管理员分配的账号登录</p>
    <form id="login-form">
      <label for="username">用户名</label>
      <input id="username" name="username" autocomplete="username" maxlength="64" required autofocus>
      <label for="password">密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button id="submit" type="submit">登录</button>
      <div id="error" role="alert"></div>
    </form>
    <p class="notice">登录失败会触发渐进式锁定。请勿共享账号或在公共设备保存密码。</p>
    <!-- E-04（2026-10-17）：免责声明此前只写在报告正文里，登录页没有 ——
         新用户看不到"结论不构成税务鉴证意见"这一条。 -->
    <p class="notice" style="margin-top:8px;line-height:1.7">
      本系统仅将你上传的资料用于财税风险识别，输出为<b>风险线索与法规依据</b>，
      <b>不构成税务鉴证意见或法律意见</b>。继续登录即表示你已知悉
      <a href="/consent" style="color:#2563eb">《数据处理告知与免责声明》</a>。
    </p>
    <p class="notice" style="text-align:center"><a href="/account-setup" style="color:#2563eb;font-weight:650">没有账号？去「账号设置」（手机号注册，初始密码=手机号）→</a></p>

    <!-- ★ 2026-10-19（用户要求：修改密码模块设置到登录页面去）：
         未登录即可自助改密 —— 因为该需求最需要它的场景恰恰是「忘记了自己改过的密码、
         登不进去」的时候；若强制先登录，入口在最需要时不可用。
         凭据 = 账号 + 原密码 + 新密码（与登录同强度：都要知道原密码）⇒ 不是提权入口。
         服务端复用**登录限流**，避免它变成绕过限流的密码爆破入口。 -->
    <p class="notice" style="text-align:center;margin-top:10px">
      <a href="#" id="toggle-change-pw" style="color:#2563eb;font-weight:650">修改密码 →</a>
    </p>
    <form id="pw-form" style="display:none">
      <label for="pw-username">账号（用户名/手机号）</label>
      <input id="pw-username" name="username" autocomplete="username" maxlength="64">
      <label for="pw-old">原密码</label>
      <input id="pw-old" type="password" autocomplete="current-password">
      <label for="pw-new">新密码（至少 12 位，含大小写字母/数字/符号中至少三类）</label>
      <input id="pw-new" type="password" autocomplete="new-password">
      <label for="pw-confirm">确认新密码</label>
      <input id="pw-confirm" type="password" autocomplete="new-password">
      <button id="pw-submit" type="submit">确认修改</button>
      <div id="pw-msg" role="alert" style="display:none"></div>
    </form>
  </main>
  <script>
    const form = document.getElementById("login-form");
    const submit = document.getElementById("submit");
    const errorBox = document.getElementById("error");
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      errorBox.style.display = "none";
      submit.disabled = true;
      submit.textContent = "正在验证…";
      try {
        const response = await fetch("/api/auth/login", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({
            username: document.getElementById("username").value.trim(),
            password: document.getElementById("password").value
          })
        });
        const data = await response.json();
        if (!response.ok || !data.ok) throw new Error(data.message || "登录失败");
        // ★ 2026-10-18 用户需求：**登录后一律直接显示「首页总览」**。
        //   此前按角色分流（管理员 → /roles 角色设置页、其他 → /），且 `/` 又会读
        //   `localStorage.lastPage` 把用户送回上次停留的内页 ⇒ 两种情况都到不了首页。
        //   现统一带一次性信号 `?page=home` 进系统：core.js 的 `_resolveLandingPage()`
        //   优先认它，落地后立即抹掉参数 ⇒ 之后刷新仍停在当前页（需求③不受影响）。
        //   「角色管理」页入口保留在侧边栏（`data-perm="role.manage"`），不再自动跳转。
        //   强制改密优先：留着口令没改就直接进系统，等于把安全策略静默废除。
        location.assign(
          data.must_change_password ? "/change-password" : "/?page=home"
        );
      } catch (error) {
        errorBox.textContent = error.message || "网络异常，请稍后重试";
        errorBox.style.display = "block";
        submit.disabled = false;
        submit.textContent = "登录";
      }
    });
  </script>
  <script>
    /* ★ 2026-10-19（用户要求：修改密码模块设置到登录页面去）
     *
     * 未登录自助改密：账号 + 原密码 + 新密码 ⇒ `POST /api/auth/change-password-public`。
     * · 该路径已登记免登录白名单（`security.is_public_path`），否则会被拦成 401；
     * · 服务端**复用登录限流**（连续失败会 429），故此处如实把 429 的提示显示出来，
     *   不自行"重试"（重试只会加深限流）；
     * · 失败一律显示服务端下发的措辞 —— 后端不区分"账号不存在/原密码错误"
     *   （防账号枚举），前端**不得**自行推断，否则等于把防枚举白做了。
     */
    (function () {
      var toggle = document.getElementById("toggle-change-pw");
      var form = document.getElementById("pw-form");
      var submit = document.getElementById("pw-submit");
      var msg = document.getElementById("pw-msg");
      if (!toggle || !form) { return; }

      function show(kind, text) {
        msg.className = kind;
        msg.textContent = text;
        msg.style.display = "block";
      }

      toggle.addEventListener("click", function (ev) {
        ev.preventDefault();
        var hidden = form.style.display === "none";
        form.style.display = hidden ? "block" : "none";
        toggle.textContent = hidden ? "收起修改密码 ↑" : "修改密码 →";
        if (hidden) {
          // 优先用已填的登录用户名，省一次输入
          var u = document.getElementById("username");
          var pu = document.getElementById("pw-username");
          if (pu && !pu.value && u && u.value) { pu.value = u.value.trim(); }
          (pu && pu.value ? document.getElementById("pw-old") : pu).focus();
        }
      });

      form.addEventListener("submit", async function (ev) {
        ev.preventDefault();
        msg.style.display = "none";
        var username = document.getElementById("pw-username").value.trim();
        var oldPw = document.getElementById("pw-old").value;
        var newPw = document.getElementById("pw-new").value;
        var confirmPw = document.getElementById("pw-confirm").value;
        if (!username) { show("err", "请填写账号"); return; }
        if (!oldPw) { show("err", "请填写原密码"); return; }
        if (newPw !== confirmPw) { show("err", "两次输入的新密码不一致"); return; }
        submit.disabled = true;
        submit.textContent = "提交中…";
        try {
          var r = await fetch("/api/auth/change-password-public", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({username: username, old_password: oldPw,
                                  new_password: newPw})
          });
          var data = await r.json().catch(function () { return {}; });
          if (!r.ok || !data.ok) {
            throw new Error(data.message || ("修改失败（HTTP " + r.status + "）"));
          }
          form.style.display = "none";
          toggle.textContent = "修改密码 →";
          show("okm", data.message || "密码已修改，请用新密码登录");
          // 顺带把账号填进登录框，省一次输入（**不填密码** —— 那不在本页职责内）
          var u2 = document.getElementById("username");
          if (u2) { u2.value = username; }
          document.getElementById("password").focus();
        } catch (error) {
          show("err", error.message || "网络异常，请稍后重试");
        } finally {
          submit.disabled = false;
          submit.textContent = "确认修改";
        }
      });
    })();
  </script>
  <script src="/static/js/page-memory.js?v=8c10b70862" defer></script>
</body>
</html>
