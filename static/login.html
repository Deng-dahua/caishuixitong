<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>财税稽查系统 — 登录</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#0f172a 0%,#1e293b 50%,#0f172a 100%);min-height:100vh;display:flex;align-items:center;justify-content:center}
.login-box{background:#fff;border-radius:12px;padding:48px 40px;width:400px;box-shadow:0 20px 60px rgba(0,0,0,0.3)}
.login-box h1{font-size:22px;font-weight:700;color:#1e293b;text-align:center;margin-bottom:8px;letter-spacing:2px}
.login-box .sub{font-size:13px;color:#94a3b8;text-align:center;margin-bottom:32px}
.form-group{margin-bottom:20px}
.form-group label{display:block;font-size:13px;font-weight:600;color:#475569;margin-bottom:6px}
.form-group input{width:100%;padding:10px 14px;border:1px solid #e2e8f0;border-radius:8px;font-size:15px;outline:none;transition:border-color 0.2s}
.form-group input:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,0.1)}
.btn-login{width:100%;padding:12px;background:#2563eb;color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;transition:background 0.2s}
.btn-login:hover{background:#1d4ed8}
.btn-login:disabled{background:#94a3b8;cursor:not-allowed}
.error-msg{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;display:none}
.footer{text-align:center;margin-top:24px;font-size:12px;color:#94a3b8}
</style>
</head>
<body>
<div class="login-box">
  <h1>财税稽查系统</h1>
  <div class="sub">全行业税务风险防控平台</div>
  <div class="error-msg" id="error-msg"></div>
  <form id="login-form" onsubmit="return handleLogin()">
    <div class="form-group">
      <label>用户名</label>
      <input type="text" id="username" placeholder="请输入用户名" autofocus required>
    </div>
    <div class="form-group">
      <label>密码</label>
      <input type="password" id="password" placeholder="请输入密码" required>
    </div>
    <button type="submit" class="btn-login" id="login-btn">登 录</button>
  </form>
  <div class="footer">仅供授权人员使用 · 操作全程留痕</div>
</div>

<script>
function showError(msg) {
  var el = document.getElementById('error-msg');
  el.textContent = msg;
  el.style.display = 'block';
}
function hideError() {
  document.getElementById('error-msg').style.display = 'none';
}

async function handleLogin() {
  var btn = document.getElementById('login-btn');
  var user = document.getElementById('username').value.trim();
  var pass = document.getElementById('password').value;
  
  if (!user || !pass) return false;
  
  hideError();
  btn.disabled = true;
  btn.textContent = '登录中...';
  
  try {
    var resp = await fetch('/api/auth/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username: user, password: pass})
    });
    var data = await resp.json();
    if (data.ok) {
      window.location.href = '/';
    } else {
      showError(data.message || '登录失败');
      btn.disabled = false;
      btn.textContent = '登 录';
    }
  } catch(e) {
    showError('网络异常，请重试');
    btn.disabled = false;
    btn.textContent = '登 录';
  }
  return false;
}

// 回车登录
document.getElementById('password').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') handleLogin();
});
</script>
</body>
</html>
