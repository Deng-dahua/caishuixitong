<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>选择账套 — 财税税务合规系统</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#0f172a 0%,#1e293b 50%,#0f172a 100%);min-height:100vh}
.top-bar{background:rgba(255,255,255,0.05);padding:16px 32px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,0.1)}
.top-bar .user{color:#e2e8f0;font-size:14px}
.top-bar .logout{color:#94a3b8;font-size:13px;cursor:pointer;background:none;border:1px solid rgba(255,255,255,0.2);padding:6px 16px;border-radius:6px;color:#e2e8f0}
.top-bar .logout:hover{background:rgba(255,255,255,0.1)}
.container{max-width:960px;margin:0 auto;padding:40px 24px}
.header{text-align:center;margin-bottom:24px}
.header h1{font-size:24px;font-weight:700;color:#f1f5f9;margin-bottom:8px}
.header p{font-size:14px;color:#94a3b8;margin-bottom:20px}
.btn-new{display:inline-block;padding:10px 28px;background:#2563eb;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;transition:background 0.2s}
.btn-new:hover{background:#1d4ed8}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:24px;position:relative;cursor:pointer;transition:all 0.2s}
.card:hover{background:rgba(255,255,255,0.12);border-color:rgba(37,99,235,0.5);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,0.3)}
.card .name{font-size:16px;font-weight:700;color:#f1f5f9;margin-bottom:8px;padding-right:32px}
.card .meta{font-size:13px;color:#94a3b8;line-height:1.8}
.card .status{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;margin-top:8px}
.card .status.active{background:rgba(22,163,74,0.2);color:#4ade80}
.card .status.inactive{background:rgba(239,68,68,0.2);color:#f87171}
.card .btn-del{position:absolute;top:12px;right:12px;width:28px;height:28px;border-radius:50%;border:none;background:rgba(239,68,68,0.15);color:#f87171;font-size:14px;line-height:28px;text-align:center;cursor:pointer;transition:all 0.2s}
.card .btn-del:hover{background:rgba(239,68,68,0.3);color:#fca5a5}
.loading{text-align:center;color:#94a3b8;padding:60px}
</style>
</head>
<body>
<div class="top-bar">
  <div class="user" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
    <span>👤 <span id="user-name">---</span></span>
    <input id="apikey-input" type="password" autocomplete="off" placeholder="密钥由安全环境管理" disabled style="width:260px;padding:6px 12px;border:1px solid rgba(255,255,255,0.2);border-radius:6px;background:rgba(255,255,255,0.08);color:#e2e8f0;font-size:12px;outline:none" onfocus="this.style.borderColor='#2563eb'" onblur="this.style.borderColor='rgba(255,255,255,0.2)'">
    <select id="apikey-provider" disabled style="padding:6px 8px;border:1px solid rgba(255,255,255,0.2);border-radius:6px;background:rgba(255,255,255,0.08);color:#e2e8f0;font-size:12px;outline:none;cursor:pointer">
      <option value="deepseek">DeepSeek</option>
      <option value="zhipu">智谱GLM</option>
      <option value="doubao">豆包</option>
      <option value="qwen">通义千问</option>
      <option value="openai">OpenAI</option>
    </select>
    <button onclick="confirmApiKey()" hidden>确定</button>
    <button onclick="deleteApiKey()" hidden>删除</button>
    <span id="apikey-status" style="font-size:11px;color:#94a3b8;margin-left:4px"></span>
  </div>
  <button class="logout" onclick="doLogout()">退出登录</button>
</div>
<div class="container">
  <div class="header">
    <h1>选择账套</h1>
    <p>选择一个公司开始税务合规工作</p>
    <a href="/new-company" class="btn-new">+ 新建账套</a>
  </div>
  <div class="loading" id="loading">加载中...</div>
  <div class="grid" id="company-grid" style="display:none"></div>
</div>

<script>
// ═══ API Key管理 ═══
function setApiStatus(text, color, loading) {
  var el = document.getElementById('apikey-status');
  if (!el) return;
  el.textContent = loading ? '⏳ ' + text : text;
  el.style.color = color;
}

function getCsrfToken() {
  var cookie = document.cookie.split('; ').find(function(c){ return c.startsWith('csrf_token='); });
  return cookie ? decodeURIComponent(cookie.split('=').slice(1).join('=')) : '';
}

async function loadApiKey() {
  try {
    var resp = await fetch('/api/apikey');
    var data = await resp.json();
    if (data.ok && data.has_key) {
      document.getElementById('apikey-input').value = '';
      if (data.provider) document.getElementById('apikey-provider').value = data.provider;
      var providerName = data.provider === 'deepseek' ? 'DeepSeek' : (data.provider || '模型服务');
      var mask = data.last4 ? ': ...' + data.last4 : '';
      setApiStatus(data.status_text || ('已接入' + providerName + mask), '#4ade80', false);
    } else {
      document.getElementById('apikey-input').value = '';
      setApiStatus('未配置', '#94a3b8', false);
    }
  } catch(e) {
    setApiStatus('加载失败', '#f87171', false);
  }
}

async function confirmApiKey() {
  var key = document.getElementById('apikey-input').value.trim();
  var provider = document.getElementById('apikey-provider').value;
  if (!key) { setApiStatus('请先输入API Key', '#fbbf24', false); return; }
  setApiStatus('检测中...', '#94a3b8', true);
  try {
    var resp = await fetch('/api/apikey', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({api_key: key, provider: provider, probe: true})
    });
    var data = await resp.json();
    if (data.ok) {
      if (data.verified) {
        setApiStatus('✅ 配置成功 - ' + (data.provider || '已接入'), '#4ade80', false);
      } else {
        setApiStatus('⚠️ 已保存 - 无法验证连通性', '#fbbf24', false);
      }
    } else {
      setApiStatus('保存失败: ' + (data.message||''), '#f87171', false);
    }
  } catch(e) {
    setApiStatus('网络错误', '#f87171', false);
  }
}

async function deleteApiKey() {
  if (!confirm('确定删除API Key？删除后追问将使用本地引擎。')) return;
  setApiStatus('删除中...', '#94a3b8', true);
  try {
    await fetch('/api/apikey', {method:'DELETE'});
    document.getElementById('apikey-input').value = '';
    setApiStatus('已删除 - 未配置', '#94a3b8', false);
  } catch(e) {
    setApiStatus('删除失败', '#f87171', false);
  }
}

async function init() {
  loadApiKey();
  try {
    var meResp = await fetch('/api/auth/me', {cache: 'no-store'});
    var me = await meResp.json();
    if (me.ok && me.username) document.getElementById('user-name').textContent = me.username;
  } catch(e) {}
  
  try {
    var resp = await fetch('/api/companies');
    var data = await resp.json();
    if (!data.ok && data.code === 401) {
      window.location.href = '/login';
      return;
    }
    var companies = Array.isArray(data) ? data : (data.companies || data.data || []);
    document.getElementById('loading').style.display = 'none';
    
    var grid = document.getElementById('company-grid');
    grid.style.display = 'grid';
    
    companies.forEach(function(c) {
      var card = document.createElement('div');
      card.className = 'card';
      card.onclick = function(e) {
        if (e.target.classList.contains('btn-del')) return;
        selectCompany(c.id);
      };
      
      card.innerHTML = 
        '<button class="btn-del" title="删除此账套">&times;</button>' +
        '<div class="name">' + (c.name || c.company_name || '未命名') + '</div>' +
        '<div class="meta">' +
        (c.uscc ? c.uscc + '<br>' : '') +
        (c.industry ? '行业：' + c.industry + '<br>' : '') +
        (c.company_type ? '类型：' + c.company_type + '<br>' : '') +
        (c.established_date ? '成立日期：' + c.established_date + '<br>' : '') +
        '</div>';
      
      // 删除按钮事件
      var delBtn = card.querySelector('.btn-del');
      delBtn.onclick = function(e) {
        e.stopPropagation();
        deleteCompany(c.id, c.name);
      };
      
      grid.appendChild(card);
      card.style.order = -(c.id || 0);
    });
    
  } catch(e) {
    document.getElementById('loading').innerHTML = '加载失败，请刷新重试';
  }
}

async function selectCompany(cid) {
  try {
    var resp = await fetch('/api/auth/select-company', {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'X-CSRF-Token': getCsrfToken()},
      body: JSON.stringify({company_id: cid})
    });
    var data = await resp.json();
    if (data.ok) {
      window.location.href = '/';
    }
  } catch(e) {
    alert('选择失败，请重试');
  }
}

async function deleteCompany(cid, cname) {
  if (!confirm('确定删除账套「' + (cname || '') + '」吗？此操作不可恢复。')) return;
  try {
    var resp = await fetch('/api/companies/' + cid, {
      method: 'DELETE',
      headers: {'X-CSRF-Token': getCsrfToken()}
    });
    var data = await resp.json();
    if (data.ok) {
      window.location.reload();
    } else {
      alert(data.detail || data.message || '删除失败');
    }
  } catch(e) {
    alert('删除失败，请重试');
  }
}

async function doLogout() {
  await fetch('/api/auth/logout', {
    method: 'POST',
    headers: {'X-CSRF-Token': getCsrfToken()}
  });
  window.location.href = '/login';
}

init();
</script>
</body>
</html>
