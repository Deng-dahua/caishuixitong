<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>解析与标准化 - 财税风险防控系统</title>
  <link rel="stylesheet" href="/static/css/app.css?v=9d7d76fc75">
  <style>
    * { box-sizing: border-box; }
    body { margin:0; font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
           background:#f5f7fa; color:#1e293b; font-size:14px; }
    .topbar { display:flex; align-items:center; gap:12px; padding:12px 20px; background:#1e293b; color:#fff; }
    .topbar h1 { font-size:16px; margin:0; font-weight:700; }
    .topbar .spacer { flex:1; }
    .topbar a, .topbar select { color:#cbd5e1; background:none; border:1px solid rgba(255,255,255,.25);
      border-radius:5px; padding:5px 12px; font-size:12px; cursor:pointer; text-decoration:none; }
    .topbar a:hover { background:rgba(255,255,255,.12); color:#fff; }
    .topbar select { background:#334155; color:#fff; }
    .wrap { padding:16px 20px; max-width:1500px; margin:0 auto; }
    .card { background:#fff; border:1px solid #e2e8f0; border-radius:8px; margin-bottom:14px; }
    .card > h2 { margin:0; padding:12px 16px; font-size:14px; border-bottom:1px solid #f1f5f9; }
    .card > .body { padding:14px 16px; }
    .toolbar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:10px; }
    .toolbar select, .toolbar input { padding:6px 10px; border:1px solid #cbd5e1; border-radius:5px; font-size:13px; }
    .btn { padding:6px 14px; border:1px solid #3b82f6; background:#3b82f6; color:#fff;
           border-radius:5px; font-size:13px; cursor:pointer; }
    .btn:hover { background:#2563eb; }
    .btn.ghost { background:#fff; color:#334155; border-color:#cbd5e1; }
    .btn.ghost:hover { background:#f1f5f9; }
    .btn:disabled { opacity:.5; cursor:not-allowed; }
    table.grid { width:100%; border-collapse:collapse; }
    table.grid th, table.grid td { padding:8px 11px; text-align:left; border-bottom:1px solid #f1f5f9;
              font-size:13px; white-space:nowrap; }
    table.grid th { background:#f8fafc; color:#64748b; font-weight:600; font-size:12px; }
    table.grid tr:hover td { background:#f8fafc; }
    .muted { color:#94a3b8; }
    .empty { padding:30px; text-align:center; color:#94a3b8; }
    .msg { padding:8px 12px; border-radius:5px; font-size:13px; margin-bottom:10px; }
    .msg.err { background:#fef2f2; color:#b91c1c; border:1px solid #fecaca; }
    .msg.ok { background:#f0fdf4; color:#15803d; border:1px solid #bbf7d0; }
    .msg.warn { background:#fffbeb; color:#b45309; border:1px solid #fde68a; }
    .tag { display:inline-block; padding:2px 8px; border-radius:10px; font-size:12px; }
    .sev-error { background:#fee2e2; color:#b91c1c; } .sev-warning { background:#fef3c7; color:#b45309; }
    .st-open { background:#f1f5f9; color:#475569; } .st-resolved { background:#dcfce7; color:#15803d; }
    .st-ignored { background:#e5e7eb; color:#4b5563; }
    .stat { display:flex; gap:18px; flex-wrap:wrap; margin:6px 0 12px; }
    .stat div { font-size:12px; color:#64748b; }
    .stat b { font-size:17px; color:#1e293b; display:block; font-weight:700; }
    .val { font-family:Consolas,Menlo,monospace; font-size:12px; }
    .val.bad { color:#b91c1c; }
    .fixed { color:#15803d; font-size:11px; }
    .tabs { display:flex; gap:6px; border-bottom:1px solid #f1f5f9; padding:0 16px; }
    .tab { padding:9px 14px; cursor:pointer; font-size:13px; color:#64748b; border-bottom:2px solid transparent; }
    .tab.active { color:#1d4ed8; border-bottom-color:#3b82f6; font-weight:600; }
    .pane[hidden] { display:none; }
    .edit-row input { padding:4px 7px; border:1px solid #cbd5e1; border-radius:4px; font-size:12px; width:130px; }
    .edit-row button { padding:3px 9px; font-size:12px; }
  </style>
  <script src="/static/js/security.js"></script>
</head>
<body>
  <div class="topbar">
    <h1>🧩 解析与标准化</h1>
    <span class="spacer"></span>
    <select id="proj"></select>
    <span id="whoami" class="muted" style="color:#94a3b8"></span>
    <a href="/documents">资料管理</a>
    <a href="/projects">项目管理</a>
    <a href="/">返回主界面</a>
  </div>

  <div class="wrap">
    <div id="msg"></div>

    <div class="card">
      <h2>选择资料并解析</h2>
      <div class="body">
        <div class="toolbar">
          <select id="doc"><option value="">（请选择资料）</option></select>
          <button class="btn" id="btn-parse">开始解析</button>
          <button class="btn ghost" id="btn-refresh">刷新</button>
          <span class="muted" id="parse-hint"></span>
        </div>
        <div class="stat" id="stats"></div>
      </div>
    </div>

    <div class="card">
      <div class="tabs">
        <div class="tab active" data-pane="pane-fields">标准化字段</div>
        <div class="tab" data-pane="pane-issues">校验异常</div>
        <div class="tab" data-pane="pane-tables">解析产物（表格预览）</div>
      </div>
      <div class="body">
        <div class="pane" id="pane-fields">
          <table class="grid">
            <thead><tr><th>域</th><th>标准字段</th><th>匹配到的原值</th><th>归一值</th><th>来源（可回链）</th><th>校正</th></tr></thead>
            <tbody id="tb-fields"><tr><td colspan="6" class="empty">请选择资料并解析</td></tr></tbody>
          </table>
        </div>
        <div class="pane" id="pane-issues" hidden>
          <table class="grid">
            <thead><tr><th>规则</th><th>严重度</th><th>说明</th><th>状态</th><th>操作</th></tr></thead>
            <tbody id="tb-issues"><tr><td colspan="5" class="empty">暂无校验异常</td></tr></tbody>
          </table>
        </div>
        <div class="pane" id="pane-tables" hidden>
          <div id="tables"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/js/extract.js" defer></script>
</body>
</html>
