<script>
// ═══ 驳回功能：完全内联 ═══
window._dismissTaxFinding = function(btn) {
  try {
    var f = JSON.parse(btn.getAttribute('data-finding'));
    var reason = prompt('请说明驳回原因：', f.title || '');
    if (!reason) return;
    fetch('/api/feedback', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({action:'dismiss', finding_type:f.type||'', finding_title:f.title||'', original_level:f.level||'', reason:reason, detail:f.detail||'', fingerprint:f.fingerprint||'', timestamp: new Date().toISOString()})
    }).then(function(r){ return r.json(); }).then(function(d){
      if(d.ok){ btn.textContent='✅ 已驳回'; btn.style.borderColor='#16a34a'; btn.style.color='#16a34a'; btn.disabled=true; }
    }).catch(function(){});
  } catch(e) {}
};

// ═══ 驳回按钮注入 — 仅在发现审查面板中运行，不影响报告正文 ═══
// 实际按钮通过 renderTaxDocReport 内部的审查面板渲染，不全局扫描DOM

// ═══ 侧边栏个人信息：从服务端会话读取 ═══
(function(){
  Promise.all([
    fetch('/api/auth/me', {cache:'no-store'}).then(function(r){ return r.json(); }),
    fetch('/api/companies', {cache:'no-store'}).then(function(r){ return r.json(); })
  ]).then(function(values){
    var me = values[0] || {};
    var list = values[1];
    var uEl = document.getElementById('sidebar-user-name');
    if (uEl && me.username) uEl.textContent = me.username;
    if (!Array.isArray(list) || !me.selected_company_id) return;
    var co = list.find(function(c){ return String(c.id) === String(me.selected_company_id); });
    if (!co) return;
    var cnEl = document.getElementById('sidebar-company-name');
    var cuEl = document.getElementById('sidebar-company-uscc');
    if (cnEl) cnEl.textContent = co.name || '';
    if (cuEl) cuEl.textContent = co.uscc || '';
  }).catch(function(){});
})();

// ═══ 退出本账套 ═══
function exitToCompanyPick() {
  window.location.href = '/select-company';
}
</script>
