<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新建公司账套</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: linear-gradient(135deg, #f0f4ff, #e8edf5);
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
}
.card {
  background: #fff;
  border-radius: 16px;
  padding: 36px 32px;
  width: 420px;
  max-width: 90vw;
  text-align: center;
  box-shadow: 0 4px 24px rgba(0,0,0,0.06);
}
.card .icon { font-size: 48px; margin-bottom: 8px; }
.card h2 { font-size: 20px; color: #1e293b; margin-bottom: 4px; }
.card .sub { font-size: 13px; color: #6b7280; margin-bottom: 20px; }
.form { display: flex; flex-direction: column; gap: 12px; }
.form input {
  width: 100%; padding: 12px 16px;
  border: 2px solid #e2e8f0; border-radius: 8px;
  font-size: 15px; outline: none;
  transition: border-color .2s;
}
.form input:focus { border-color: #2563eb; background: #fff; }
.form button {
  padding: 14px;
  background: linear-gradient(135deg, #2563eb, #1d4ed8);
  color: #fff; border: none; border-radius: 8px;
  font-size: 16px; font-weight: 600; cursor: pointer;
}
.form button:disabled { opacity: 0.6; cursor: not-allowed; }
.back { margin-top: 16px; }
.back a { color: #6b7280; font-size: 13px; cursor: pointer; text-decoration: none; }
.back a:hover { color: #2563eb; }
.toast {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
  padding: 10px 24px; border-radius: 8px; font-size: 14px;
  z-index: 9999; display: none;
}
.toast.error { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
</style>
</head>
<body>

<div class="card">
  <div class="icon">🏢</div>
  <h2>新建公司账套</h2>
  <p class="sub">为您的企业创建第一个账套，开始财税管理</p>
  <div class="form">
    <input type="text" id="reg-name" placeholder="公司全称（必填）*" required>
    <input type="text" id="reg-uscc" placeholder="统一社会信用代码（选填）">
    <button id="reg-submit-btn" onclick="doRegister()">✅ 创建账套，进入系统</button>
  </div>
  <div class="back"><a onclick="goBack()">← 返回选择公司</a></div>
</div>

<div id="toast" class="toast"></div>

<script>
function toast(msg, type) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast ' + (type || 'error');
  el.style.display = 'block';
  setTimeout(function() { el.style.display = 'none'; }, 3000);
}

function goBack() {
  window.location.href = '/xuanzezhangtao/';
}

async function doRegister() {
  var name = document.getElementById('reg-name').value.trim();
  if (!name) { toast('请输入公司全称'); return; }
  var uscc = document.getElementById('reg-uscc').value.trim() || null;
  var btn = document.getElementById('reg-submit-btn');
  btn.disabled = true;
  btn.textContent = '⏳ 正在创建...';
  try {
    var data = await fetch('/api/companies', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name, uscc: uscc })
    }).then(function(r) {
      if (!r.ok) return r.json().then(function(e) { throw new Error(e.detail || '创建失败'); });
      return r.json();
    });
    // 创建成功，返回账套选择页
    window.location.href = '/xuanzezhangtao/';
  } catch(e) {
    toast('创建失败：' + e.message);
    btn.disabled = false;
    btn.textContent = '✅ 创建账套，进入系统';
  }
}
</script>

</body>
</html>
