<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>账号设置 · 财税风险防控系统</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh; margin: 0; display: grid; place-items: center;
      font-family: "Microsoft YaHei", system-ui, sans-serif;
      color: #1f2937; background: linear-gradient(145deg, #081226, #17325e);
    }
    main {
      width: min(440px, calc(100% - 32px)); padding: 40px;
      background: #fff; border-radius: 16px; box-shadow: 0 24px 70px #0006;
    }
    h1 { margin: 0 0 8px; font-size: 22px; text-align: center; }
    .subtitle { margin: 0 0 24px; color: #667085; text-align: center; font-size: 14px; }
    label { display: block; margin: 14px 0 7px; font-size: 14px; font-weight: 650; }
    input {
      width: 100%; padding: 12px 14px; border: 1px solid #cbd5e1;
      border-radius: 9px; font-size: 16px; outline: none;
    }
    input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px #2563eb22; }
    button {
      width: 100%; margin-top: 22px; padding: 12px; border: 0; border-radius: 9px;
      color: #fff; background: #1d4ed8; font-size: 16px; font-weight: 700; cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    button.ghost { background: #eef2f7; color: #1d4ed8; }
    #msg {
      display: none; margin-top: 16px; padding: 10px 12px; border-radius: 8px;
      font-size: 14px; line-height: 1.7;
    }
    .err { border: 1px solid #fecaca; color: #991b1b; background: #fef2f2; }
    .okm { border: 1px solid #bbf7d0; color: #15803d; background: #f0fdf4; }
    .hint { margin: 18px 0 0; color: #667085; font-size: 12px; line-height: 1.7; }
  </style>
</head>
<body>
  <main>
    <h1>账号设置</h1>
    <p class="subtitle">填手机号即可创建账号 · 初始密码 = 手机号</p>
    <div id="done" style="display:none">
      <div id="msg" class="okm" style="display:block"></div>
      <button id="go-login" class="ghost" onclick="location.href='/login'">去登录 →</button>
    </div>
    <form id="setup-form">
      <label for="phone">手机号（将作为登录账号）</label>
      <input id="phone" maxlength="11" inputmode="numeric" placeholder="1 开头的 11 位数字" required autofocus>
      <label for="display_name">姓名（选填）</label>
      <input id="display_name" maxlength="32" placeholder="用于系统内显示">
      <button id="submit" type="submit">创建账号</button>
      <div id="msg-err" class="err" role="alert" style="display:none;margin-top:16px"></div>
    </form>
    <p class="hint">
      · 初始密码即手机号，登录后可直接使用；建议尽快在侧边栏「修改密码」中更换；<br>
      · 创建后会自动进入登录页。
    </p>
  </main>
  <script>
    const form = document.getElementById("setup-form");
    const submit = document.getElementById("submit");
    const errBox = document.getElementById("msg-err");
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      errBox.style.display = "none";
      submit.disabled = true;
      submit.textContent = "创建中…";
      try {
        const response = await fetch("/api/auth/register", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({
            phone: document.getElementById("phone").value.trim(),
            display_name: document.getElementById("display_name").value.trim()
          })
        });
        const data = await response.json();
        if (!response.ok || !data.ok) throw new Error(data.message || "创建失败");
        // 成功：隐藏表单，展示结果
        document.getElementById("setup-form").style.display = "none";
        const box = document.getElementById("msg");
        box.className = "okm";
        box.style.display = "block";
        box.innerHTML = "账号创建成功！<br>登录账号：<b>" +
          String(data.username).replace(/</g, "&lt;") + "</b>（手机号）<br>" +
          "初始密码：<b>" + String(data.initial_password).replace(/</g, "&lt;") +
          "</b>（即手机号）<br>首次登录后请立即修改密码。";
        document.getElementById("done").style.display = "block";
      } catch (error) {
        errBox.textContent = error.message || "网络异常，请稍后重试";
        errBox.style.display = "block";
        submit.disabled = false;
        submit.textContent = "创建账号";
      }
    });
  </script>
  <script src="/static/js/page-memory.js?v=8c10b70862" defer></script>
</body>
</html>
