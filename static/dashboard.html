<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>数据大屏 - 财税风险防控系统</title>
  <link rel="stylesheet" href="/static/css/app.css?v=9d7d76fc75">
  <style>
    * { box-sizing: border-box; }
    body { margin:0; font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
           background:#f1f5f9; color:#1e293b; font-size:14px; }
    .topbar { display:flex; align-items:center; gap:12px; padding:12px 20px; background:#0f172a; color:#fff; }
    .topbar h1 { font-size:16px; margin:0; font-weight:700; }
    .topbar .spacer { flex:1; }
    .topbar a { color:#cbd5e1; border:1px solid rgba(255,255,255,.25); border-radius:5px;
                padding:5px 12px; font-size:12px; text-decoration:none; }
    .topbar a:hover { background:rgba(255,255,255,.12); color:#fff; }
    .wrap { padding:16px 20px; max-width:1500px; margin:0 auto; }
    .grid3 { display:grid; grid-template-columns:repeat(auto-fit,minmax(330px,1fr)); gap:14px; }
    .card { background:#fff; border:1px solid #e2e8f0; border-radius:9px; }
    .card > h3 { margin:0; padding:12px 16px; font-size:14px; border-bottom:1px solid #f1f5f9;
                 display:flex; align-items:center; gap:8px; }
    .card > .body { padding:14px 16px; }
    .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; }
    .kpi { background:linear-gradient(180deg,#f8fafc,#fff); border:1px solid #e2e8f0;
           border-radius:9px; padding:13px 15px; }
    .kpi .n { font-size:26px; font-weight:800; color:#0f172a; letter-spacing:.5px; }
    .kpi .t { font-size:12px; color:#64748b; margin-top:4px; }
    .kpi.warn .n { color:#b45309; }
    .bar-row { display:flex; align-items:center; gap:9px; margin-bottom:7px; font-size:13px; }
    .bar-row .lb { width:118px; color:#475569; flex:none; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .bar-row .bar { flex:1; height:16px; background:#eef2f7; border-radius:4px; position:relative; }
    .bar-row .bar > i { position:absolute; top:0; bottom:0; left:0; background:#60a5fa; border-radius:4px; }
    .bar-row .vv { width:56px; text-align:right; color:#0f172a; font-variant-numeric:tabular-nums; }
    table.grid { width:100%; border-collapse:collapse; }
    table.grid th, table.grid td { padding:8px 10px; text-align:left; border-bottom:1px solid #f1f5f9; font-size:13px; }
    table.grid th { background:#f8fafc; color:#64748b; font-weight:600; font-size:12px; }
    .muted { color:#94a3b8; }
    .msg { padding:8px 12px; border-radius:5px; font-size:13px; margin-bottom:10px; }
    .msg.warn { background:#fffbeb; color:#b45309; border:1px solid #fde68a; }
    .msg.err { background:#fef2f2; color:#b91c1c; border:1px solid #fecaca; }
    .tag { display:inline-block; padding:2px 8px; border-radius:10px; font-size:12px; background:#f1f5f9; color:#475569; }
    .tag.ok { background:#dcfce7; color:#15803d; }
    .tag.no { background:#fef3c7; color:#b45309; }
    svg .axis { stroke:#cbd5e1; stroke-width:1; }
    svg .ln { fill:none; stroke:#3b82f6; stroke-width:2; }
    svg .pt { fill:#3b82f6; }
    svg text { font-size:10px; fill:#64748b; }
  </style>
  <script src="/static/js/constants.js"></script>
  <script src="/static/js/security.js"></script>
</head>
<body>
  <div class="topbar">
    <h1>📈 数据大屏</h1>
    <span class="spacer"></span>
    <span class="muted" id="who" style="color:#94a3b8"></span>
    <a href="/projects">稽查项目</a>
    <a href="/index">返回主界面</a>
  </div>
  <div class="wrap">
    <div id="alert"></div>
    <div class="card" style="margin-bottom:14px">
      <h3>核心指标 <span class="muted" id="scope-note" style="font-weight:400"></span></h3>
      <div class="body"><div class="kpis" id="kpis"></div></div>
    </div>

    <div class="grid3">
      <div class="card"><h3>项目状态分布</h3><div class="body" id="c-proj"></div></div>
      <div class="card"><h3>资料分类分布</h3><div class="body" id="c-doc"></div></div>
      <div class="card"><h3>分析任务状态</h3><div class="body" id="c-task"></div></div>
      <div class="card"><h3>风险等级分布 <span class="muted" id="risk-scope" style="font-weight:400"></span></h3>
        <div class="body" id="c-risk"></div></div>
      <div class="card"><h3>风险税种分布</h3><div class="body" id="c-tax"></div></div>
      <div class="card"><h3>操作留痕趋势 <span class="muted" id="act-scope" style="font-weight:400"></span></h3>
        <div class="body" id="c-act"></div></div>
    </div>

    <div class="card" style="margin-top:14px">
      <h3>按项目明细 <span class="muted" id="pp-note"></span></h3>
      <div class="body">
        <table class="grid">
          <thead><tr><th>项目</th><th style="width:110px">编号</th><th style="width:100px">状态</th>
            <th style="width:110px">行业</th><th style="width:90px">资料</th>
            <th style="width:90px">分析任务</th><th style="width:150px">风险</th></tr></thead>
          <tbody id="tb-pp"><tr><td colspan="7" class="muted">加载中…</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="/static/js/dashboard.js"></script>
</body>
</html>
