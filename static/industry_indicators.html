<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>行业指标库 - 财税风险防控系统</title>
  <link rel="stylesheet" href="/static/css/app.css?v=9d7d76fc75">
  <style>
    * { box-sizing: border-box; }
    body { margin:0; font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
           background:#f5f7fa; color:#1e293b; font-size:14px; }
    .topbar { display:flex; align-items:center; gap:12px; padding:12px 20px; background:#1e293b; color:#fff; }
    .topbar h1 { font-size:16px; margin:0; font-weight:700; }
    .topbar .spacer { flex:1; }
    .topbar a { color:#cbd5e1; border:1px solid rgba(255,255,255,.25); border-radius:5px;
                padding:5px 12px; font-size:12px; text-decoration:none; }
    .topbar a:hover { background:rgba(255,255,255,.12); color:#fff; }
    .wrap { padding:16px 20px; max-width:1400px; margin:0 auto; }
    .card { background:#fff; border:1px solid #e2e8f0; border-radius:8px; margin-bottom:14px; }
    .card > h3 { margin:0; padding:12px 16px; font-size:14px; border-bottom:1px solid #f1f5f9; }
    .card > .body { padding:14px 16px; }
    .kpis { display:flex; flex-wrap:wrap; gap:10px; }
    .kpi { flex:1 1 130px; background:#f8fafc; border:1px solid #e2e8f0; border-radius:7px; padding:10px 12px; }
    .kpi .n { font-size:19px; font-weight:700; color:#0f172a; }
    .kpi .t { font-size:12px; color:#64748b; margin-top:3px; }
    .toolbar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:10px; }
    .toolbar input { padding:6px 10px; border:1px solid #cbd5e1; border-radius:5px; font-size:13px; min-width:220px; }
    .btn { padding:6px 14px; border:1px solid #3b82f6; background:#3b82f6; color:#fff;
           border-radius:5px; font-size:13px; cursor:pointer; }
    .btn:hover { background:#2563eb; }
    .btn.ghost { background:#fff; color:#334155; border-color:#cbd5e1; }
    .btn.ghost:hover { background:#f1f5f9; }
    table.grid { width:100%; border-collapse:collapse; }
    table.grid th, table.grid td { padding:8px 11px; text-align:left; border-bottom:1px solid #f1f5f9;
                                   font-size:13px; vertical-align:top; }
    table.grid th { background:#f8fafc; color:#64748b; font-weight:600; font-size:12px; }
    table.grid tr:hover td { background:#f8fafc; }
    .muted { color:#94a3b8; }
    .msg { padding:8px 12px; border-radius:5px; font-size:13px; margin-bottom:10px; }
    .msg.warn { background:#fffbeb; color:#b45309; border:1px solid #fde68a; }
    .msg.err { background:#fef2f2; color:#b91c1c; border:1px solid #fecaca; }
    .tag { display:inline-block; padding:2px 8px; border-radius:10px; font-size:12px; background:#f1f5f9; color:#475569; }
    .tag.cal { background:#dcfce7; color:#15803d; }
    .tag.gen { background:#fef3c7; color:#b45309; }
    .law-link { color:#2563eb; cursor:pointer; text-decoration:none; }
    .law-link:hover { text-decoration:underline; }
    .barcell { white-space:nowrap; }
    .bar { position:relative; height:16px; background:#eef2f7; border-radius:4px; min-width:170px; }
    .bar > i { position:absolute; top:0; bottom:0; background:#93c5fd; border-radius:4px; }
    .barlab { font-size:12px; color:#475569; font-variant-numeric:tabular-nums; }
    dialog { border:1px solid #cbd5e1; border-radius:8px; max-width:860px; width:94%; padding:0; }
    dialog::backdrop { background:rgba(15,23,42,.45); }
    .dhead { padding:12px 16px; border-bottom:1px solid #f1f5f9; display:flex; align-items:center; gap:8px; }
    .dhead h4 { margin:0; font-size:14px; flex:1; }
    .dbody { padding:14px 16px; max-height:68vh; overflow:auto; }
    pre.plain { margin:0; white-space:pre-wrap; word-break:break-word; font-family:inherit; line-height:1.6; }
  </style>
  <script src="/static/js/security.js?v=96a020abfa"></script>
</head>
<body>
  <div class="topbar">
    <h1>📊 行业指标库</h1>
    <span class="spacer"></span>
    <span class="muted" id="who" style="color:#94a3b8"></span>
    <a href="/legal-library">法规库</a>
    <a href="/?page=home">返回主界面</a>
  </div>
  <div class="wrap">
    <div id="alert"></div>

    <div class="card">
      <h3>指标库概览 <span class="muted" id="caution" style="font-weight:400"></span></h3>
      <div class="body">
        <div class="kpis" id="kpis"></div>
        <div class="muted" id="src-note" style="margin-top:10px;line-height:1.7"></div>
        <div class="muted" id="prio-note" style="margin-top:6px;line-height:1.7"></div>
      </div>
    </div>

    <div class="card">
      <h3>行业清单 <span class="muted" id="ind-hint"></span></h3>
      <div class="body">
        <div class="toolbar">
          <input type="text" id="q" placeholder="按行业名 / 编码筛选（如「制造」）">
          <button class="btn" id="btn-search">筛选</button>
          <button class="btn ghost" id="btn-reset">重置</button>
        </div>
        <table class="grid">
          <thead><tr><th style="width:150px">行业</th><th style="width:130px">编码</th>
            <th style="width:110px">基准来源</th><th style="width:80px">指标数</th>
            <th>指标区间</th></tr></thead>
          <tbody id="tb-inds"><tr><td colspan="5" class="muted">加载中…</td></tr></tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <h3>指标键覆盖 <span class="muted" id="cov-hint"></span></h3>
      <div class="body">
        <table class="grid">
          <thead><tr><th style="width:150px">指标</th><th style="width:120px">键</th>
            <th style="width:90px">量纲</th><th style="width:110px">覆盖行业数</th><th>说明</th></tr></thead>
          <tbody id="tb-keys"><tr><td colspan="5" class="muted">加载中…</td></tr></tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <h3>兜底区间 <span class="muted">（未匹配到行业时使用，**不得**当作某行业基准）</span></h3>
      <div class="body">
        <div class="muted" id="gen-note" style="margin-bottom:8px"></div>
        <table class="grid">
          <thead><tr><th style="width:150px">指标</th><th style="width:110px">下沿</th>
            <th style="width:110px">上沿</th><th style="width:80px">量纲</th></tr></thead>
          <tbody id="tb-gen"><tr><td colspan="4" class="muted">加载中…</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>

  <dialog id="dlg">
    <div class="dhead"><h4 id="dlg-title"></h4><button class="btn ghost" id="dlg-close">关闭</button></div>
    <div class="dbody" id="dlg-body"></div>
  </dialog>

  <script src="/static/js/industry_indicators.js?v=cd3abb9eea"></script>
  <script src="/static/js/page-memory.js?v=8c10b70862" defer></script>
</body>
</html>
